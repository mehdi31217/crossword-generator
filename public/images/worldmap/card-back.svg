<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1118" width="800" height="1118" role="img" aria-label="Crossword Legends card back">
  <defs>
    <clipPath id="shield">
      <path d="M 371,72 L 273,82 L 185,106 L 172,137 L 149,164 L 124,179 L 92,185 L 92,890 L 103,918 L 124,934 L 323,1002 L 400,1036 L 475,1002 L 674,934 L 695,918 L 703,904 L 706,185 L 674,179 L 647,162 L 625,135 L 613,106 L 544,86 L 494,77 Z"/>
    </clipPath>

    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#16224e"/>
      <stop offset="0.45" stop-color="#0e1737"/>
      <stop offset="1" stop-color="#070c20"/>
    </linearGradient>

    <radialGradient id="aura" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#2b3f7d" stop-opacity="0.85"/>
      <stop offset="0.55" stop-color="#16224e" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#070c20" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6e2a8"/>
      <stop offset="0.38" stop-color="#d9b264"/>
      <stop offset="0.62" stop-color="#a97f36"/>
      <stop offset="1" stop-color="#f2d995"/>
    </linearGradient>

    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#9fc4ff" stop-opacity="0.10"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.56" stop-color="#9fc4ff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <pattern id="stars" width="90" height="90" patternUnits="userSpaceOnUse" patternTransform="rotate(0)">
      <g fill="none" stroke="#e6cf92" stroke-width="1.1" opacity="0.16">
        <path d="M45 28 L52 45 L69 52 L52 59 L45 76 L38 59 L21 52 L38 45 Z"/>
        <circle cx="0" cy="0" r="2.2"/>
        <circle cx="90" cy="90" r="2.2"/>
      </g>
    </pattern>

    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <radialGradient id="vignette" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.42"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#shield)">
    <rect width="800" height="1118" fill="url(#bg)"/>
    <rect width="800" height="1118" fill="url(#aura)"/>
    <rect width="800" height="1118" fill="url(#stars)"/>

    <!-- soft diagonal foil sweep -->
    <path d="M -200 1180 L 380 -80 L 560 -80 L -20 1180 Z" fill="url(#beam)" opacity="0.9"/>
    <path d="M 80 1180 L 660 -80 L 700 -80 L 120 1180 Z" fill="#ffffff" opacity="0.03"/>

    <!-- outer gold hairline following the silhouette -->
    <path d="M 371,72 L 273,82 L 185,106 L 172,137 L 149,164 L 124,179 L 92,185 L 92,890 L 103,918 L 124,934 L 323,1002 L 400,1036 L 475,1002 L 674,934 L 695,918 L 703,904 L 706,185 L 674,179 L 647,162 L 625,135 L 613,106 L 544,86 L 494,77 Z"
      fill="none" stroke="url(#gold)" stroke-width="4" opacity="0.85"/>

    <!-- inner frame (silhouette scaled around its centre) -->
    <g transform="translate(400 552) scale(0.90) translate(-400 -552)" fill="none">
      <path d="M 371,72 L 273,82 L 185,106 L 172,137 L 149,164 L 124,179 L 92,185 L 92,890 L 103,918 L 124,934 L 323,1002 L 400,1036 L 475,1002 L 674,934 L 695,918 L 703,904 L 706,185 L 674,179 L 647,162 L 625,135 L 613,106 L 544,86 L 494,77 Z"
        stroke="url(#gold)" stroke-width="3" opacity="0.55"/>
      <path d="M 371,72 L 273,82 L 185,106 L 172,137 L 149,164 L 124,179 L 92,185 L 92,890 L 103,918 L 124,934 L 323,1002 L 400,1036 L 475,1002 L 674,934 L 695,918 L 703,904 L 706,185 L 674,179 L 647,162 L 625,135 L 613,106 L 544,86 L 494,77 Z"
        transform="translate(400 552) scale(0.975) translate(-400 -552)"
        stroke="url(#gold)" stroke-width="1.2" opacity="0.35"/>
    </g>

    <!-- corner arabesques -->
    <g stroke="url(#gold)" fill="none" stroke-linecap="round" opacity="0.6">
      <g transform="translate(150 250)">
        <path d="M 0 44 C 0 16 18 0 44 0" stroke-width="2.6"/>
        <path d="M 16 52 C 16 30 30 16 52 16" stroke-width="1.4" opacity="0.7"/>
        <circle cx="58" cy="12" r="3" fill="url(#gold)" stroke="none"/>
      </g>
      <g transform="translate(650 250) scale(-1 1)">
        <path d="M 0 44 C 0 16 18 0 44 0" stroke-width="2.6"/>
        <path d="M 16 52 C 16 30 30 16 52 16" stroke-width="1.4" opacity="0.7"/>
        <circle cx="58" cy="12" r="3" fill="url(#gold)" stroke="none"/>
      </g>
      <g transform="translate(150 820) scale(1 -1)">
        <path d="M 0 44 C 0 16 18 0 44 0" stroke-width="2.6"/>
        <path d="M 16 52 C 16 30 30 16 52 16" stroke-width="1.4" opacity="0.7"/>
        <circle cx="58" cy="12" r="3" fill="url(#gold)" stroke="none"/>
      </g>
      <g transform="translate(650 820) scale(-1 -1)">
        <path d="M 0 44 C 0 16 18 0 44 0" stroke-width="2.6"/>
        <path d="M 16 52 C 16 30 30 16 52 16" stroke-width="1.4" opacity="0.7"/>
        <circle cx="58" cy="12" r="3" fill="url(#gold)" stroke="none"/>
      </g>
    </g>

    <!-- top crest -->
    <g transform="translate(400 215)" opacity="0.75">
      <path d="M -120 0 H -26 M 26 0 H 120" stroke="url(#gold)" stroke-width="1.6"/>
      <path d="M 0 -16 L 10 0 L 0 16 L -10 0 Z" fill="url(#gold)"/>
      <circle cx="-136" cy="0" r="2.6" fill="url(#gold)"/>
      <circle cx="136" cy="0" r="2.6" fill="url(#gold)"/>
    </g>

    <!-- central medallion -->
    <g transform="translate(400 520)">
      <polygon points="0,-164 116,-116 164,0 116,116 0,164 -116,116 -164,0 -116,-116"
        fill="none" stroke="url(#gold)" stroke-width="2.4" opacity="0.55"/>
      <polygon points="0,-138 97,-97 138,0 97,97 0,138 -97,97 -138,0 -97,-97"
        fill="#0d1738" fill-opacity="0.55" stroke="url(#gold)" stroke-width="1.6" opacity="0.9"/>
      <circle r="118" fill="none" stroke="url(#gold)" stroke-width="1.2" opacity="0.55"/>
      <circle r="108" fill="none" stroke="url(#gold)" stroke-width="2.2" opacity="0.35" filter="url(#softGlow)"/>

      <!-- dotted halo -->
      <g fill="url(#gold)" opacity="0.6">
        <circle cx="0" cy="-126" r="2.4"/><circle cx="48" cy="-117" r="2.4"/>
        <circle cx="89" cy="-89" r="2.4"/><circle cx="117" cy="-48" r="2.4"/>
        <circle cx="126" cy="0" r="2.4"/><circle cx="117" cy="48" r="2.4"/>
        <circle cx="89" cy="89" r="2.4"/><circle cx="48" cy="117" r="2.4"/>
        <circle cx="0" cy="126" r="2.4"/><circle cx="-48" cy="117" r="2.4"/>
        <circle cx="-89" cy="89" r="2.4"/><circle cx="-117" cy="48" r="2.4"/>
        <circle cx="-126" cy="0" r="2.4"/><circle cx="-117" cy="-48" r="2.4"/>
        <circle cx="-89" cy="-89" r="2.4"/><circle cx="-48" cy="-117" r="2.4"/>
      </g>

      <!-- crossword crest: 3x3 grid, two solved cells -->
      <g transform="translate(-66 -66)">
        <rect x="0" y="0" width="132" height="132" rx="10" fill="#060b1c" fill-opacity="0.55"/>
        <g stroke="url(#gold)" stroke-width="2.4" opacity="0.85">
          <rect x="0" y="0" width="132" height="132" rx="10" fill="none"/>
          <path d="M44 0 V132 M88 0 V132 M0 44 H132 M0 88 H132"/>
        </g>
        <rect x="3" y="3" width="38" height="38" rx="5" fill="url(#gold)" opacity="0.9"/>
        <rect x="91" y="47" width="38" height="38" rx="5" fill="url(#gold)" opacity="0.75"/>
        <rect x="47" y="91" width="38" height="38" rx="5" fill="url(#gold)" opacity="0.6"/>
        <g fill="url(#gold)" opacity="0.95">
          <circle cx="59" cy="59" r="3.4"/>
          <circle cx="103" cy="103" r="3.4"/>
        </g>
      </g>
    </g>

    <!-- bottom emblem -->
    <g transform="translate(400 930)" opacity="0.65">
      <path d="M -54 0 L -38 12 L -22 0 L -38 -12 Z" fill="url(#gold)"/>
      <path d="M 22 0 L 38 12 L 54 0 L 38 -12 Z" fill="url(#gold)"/>
      <path d="M -10 0 L 0 -10 L 10 0 L 0 10 Z" fill="url(#gold)" opacity="0.9"/>
    </g>

    <rect width="800" height="1118" fill="url(#vignette)"/>
  </g>
</svg>
