# Crossword Gen Pro — Nginx Production Config
# Place in /etc/nginx/sites-available/crossword
# sudo ln -s /etc/nginx/sites-available/crossword /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx

upstream crossword_backend {
    # PM2 cluster instances (one per CPU core)
    server 127.0.0.1:8081;
    # Add more servers if running on multiple ports:
    # server 127.0.0.1:8082;
    # server 127.0.0.1:8083;
    keepalive 64;
}

server {
    listen 80;
    server_name your-domain.com;  # CHANGE THIS

    # ─── Redirect to HTTPS (uncomment after SSL setup) ───
    # return 301 https://$host$request_uri;
    # }

    # server {
    #     listen 443 ssl http2;
    #     server_name your-domain.com;  # CHANGE THIS
    #
    #     ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;

    # ─── Security Headers ────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ─── Gzip ────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # ─── Static Files (frontend build output) ────────────
    root /opt/crossword-gen-pro/dist;
    index index.html;

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Service worker (no cache)
    location /sw.js {
        add_header Cache-Control "no-cache";
    }

    # ─── API Proxy ──────────────────────────────────────
    location /api/ {
        proxy_pass http://crossword_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Rate limiting per IP for API
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;
    }

    # ─── WebSocket Proxy ────────────────────────────────
    location /ws {
        proxy_pass http://crossword_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # WebSocket connections are long-lived — no rate limit
    }

    # ─── SPA fallback ───────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─── Deny hidden files ──────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
